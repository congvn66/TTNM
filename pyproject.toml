[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "report-qa"
version = "0.1.0"
description = "Evidence-first PDF QA MVP with one traceable session/document flow"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "jsonschema>=4,<5",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "pytest>=8,<9",
  "jsonschema>=4,<5",
]
postgres = [
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
]
pdf-extraction = [
  "pdfplumber>=0.11,<1",
  "PyMuPDF>=1.24,<2",
  "Pillow>=10,<12",
  "pytesseract>=0.3.10,<1",
]

docling-deplot = [
  "docling==2.142.1",
  "transformers==5.20.2",
  "torch>=2.6,<3",
  "PyMuPDF>=1.24,<3",
  "Pillow>=10,<13",
  "sentencepiece>=0.2,<1",
]

[tool.setuptools.packages.find]
where = ["services/backend/src"]

[tool.pytest.ini_options]
pythonpath = ["services/backend/src"]
testpaths = ["services/backend/tests"]

[tool.setuptools.package-data]
"report_qa.resources" = ["*.schema.json"]
